# Pages CMS config – portfolio images & project data
# Docs: https://pagescms.org/docs/configuration
# After pushing to GitHub, sign in at https://app.pagescms.org and open this repo.

media:
  input: images
  output: /images

content:
  - name: homepage
    label: Homepage
    type: file
    path: data/homepage.json
    format: json
    fields:
      - name: intro_text
        label: Intro text
        type: text
        description: Main intro paragraph text (appears at top of homepage)
      - name: footer_title
        label: Footer title
        type: string
        description: Footer heading (e.g. "Thanks for<br>stopping by!")
  - name: projects
    label: Projects Grid
    type: file
    path: data/projects.json
    format: json
    fields:
      - name: projects
        label: Projects
        type: object
        list: true
        description: List of all projects displayed on homepage
        fields:
          - name: name
            label: Project Name
            type: string
            description: Title of the project
          - name: description
            label: Description
            type: text
            description: Short description of the project
          - name: tags
            label: Tags
            type: string
            list: true
            description: Project tags (e.g. "Brand Identity", "Web Design")
          - name: image
            label: Project Image
            type: image
            description: Project thumbnail/cover image
          - name: link
            label: Project Link
            type: string
            description: URL to project page (leave empty for no link)
  - name: project
    label: Project / Gallery
    type: file
    path: data/project.json
    format: json
    fields:
      - name: title
        label: Project title
        type: string
        description: Main heading (e.g. "James H. Miller Jr. Data Book Design")
      - name: sections
        label: Content areas (images)
        type: object
        list: true
        description: Each item is one full-width content block. Add an image to display it.
        fields:
          - name: image
            label: Image
            type: image
            description: Upload or choose an image for this section
      - name: intro_label
        label: Intro label
        type: string
        description: Small label above intro title (e.g. "INTRO")
      - name: intro_title
        label: Intro title
        type: string
        description: Main intro heading (e.g. "Where life gains STEAM")
      - name: intro_content
        label: Intro content
        type: text
        description: Intro paragraph text (separate multiple paragraphs with double line breaks)
      - name: image_text_label
        label: Image-text section label
        type: string
        description: Small label above text next to 4th image (e.g. "PRINTING")
      - name: image_text_content
        label: Text next to 4th image
        type: text
        description: Large text that appears to the right of the 4th image
